# NO CURADOS: fallan el criterio de univocidad del vector (§5.2). Quedan como
# `producto_sin_clasificar` —trabajo pendiente que un humano puede afinar—, no como
# inespecíficos: el par SÍ designa un producto; lo que no determina es la clase de vector.
#
#   Sistemas operativos completos, que abarcan varias clases de vector:
#     - Microsoft / Windows (172 entradas, el par más frecuente del catálogo): va de la
#       elevación local en el núcleo al servicio de red alcanzable en remoto.
#     - Apple / iOS, iPadOS, and macOS (11); Apple / iOS (8); Apple / iOS and iPadOS (5);
#       Apple / macOS (5).
#     - Microsoft / Defender (5): mezcla elevación local y ejecución al analizar contenido.
#
#   Nombres de familia o suite, que agrupan productos heterogéneos:
#     - Zoho / ManageEngine (6): cubre decenas de productos con exposiciones distintas.
#     - Oracle / Fusion Middleware (6): plataforma que agrupa componentes heterogéneos.
#   Ambos estaban curados como T1190 en la versión anterior de esta tabla y se RETIRAN al
#   aplicar el criterio: un criterio aplicado de forma desigual es peor que no tenerlo.
