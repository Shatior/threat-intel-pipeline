# Tabla curada producto → vector de explotación para la ruta B (§5.2).
#
# SIN PATRONES Y SIN CAÍDA POR DEFECTO. La clave es el par canonicalizado
# (vendorProject, product). Un producto ausente NO infiere nada: rellenar con "lo más
# probable" es lo que prohíbe §5.4. Lo inclasificable se declara aquí con
# `inespecifico: true`, no se detecta buscando "multiple" en el nombre — eso reintroduciría
# el patrón sobre nombres que esta sección rechaza.
#
# CRITERIO DE CURACIÓN: UNIVOCIDAD DEL VECTOR (§5.2). Un par se cura si, y solo si,
# determina por sí mismo la clase de vector. No es "componente frente a sistema entero":
# `Linux / Kernel` se cura porque "núcleo" implica escalada local sin ambigüedad;
# `Microsoft / Windows` no, porque abarca desde el navegador hasta el arranque. El criterio
# se ha aplicado a la tabla ENTERA, no caso a caso: cada entrada lleva justificación escrita
# precisamente para poder auditarla contra él.
#
# Solo se admiten las cuatro técnicas de vector de §5.2: T1190, T1203, T1068, T1210.
#
# COBERTURA MEDIDA (2026-08-02, catalogVersion 2026.07.29, 1656 entradas) — la real, no
# la deseada:
#   - con vector inferido ......... 510 entradas (30.8%)
#   - inclasificables por el par .. 129 entradas (7.8%) → producto_inespecifico
#   - resto ....................... → producto_sin_clasificar (crece por la cola de trabajo)
# No hay techo teórico: hay un suelo inalcanzable —los pares inespecíficos— y el resto
# depende de cuánto se cure. Cada informe publica la cifra del día, no una proyección.

