[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatintel"
version = "0.1.0"
description = "Pipeline automatizado de Ciberinteligencia (CTI) sobre fuentes públicas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.1",
]

[project.scripts]
threatintel = "threatintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

# Conjunto de reglas seleccionado explícitamente: define QUÉ reglas se aplican, para no
# depender de los valores por defecto de ruff (que varían entre versiones). La
# reproducibilidad del lint la garantiza la versión exacta de ruff fijada en las
# dependencias de desarrollo, no esta selección.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DTZ"]
